<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Noise Processing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        .color-options {
            display: flex;
            flex-wrap: wrap;
            max-width: 300px; /* Adjust as needed */
        }
        .color-option {
            width: 33%; /* Adjust for number of columns */
            padding: 2px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Failed Denoising Effects lol</h2>
        <form id="upload-form" enctype="multipart/form-data">
            <label for="imageUpload">Choose an image to upload:</label>
            <input type="file" id="imageUpload" name="file" title="Upload an image file" required>
            <br>
            <label>Select Noise Color:</label>
            <select id="colorSelect" name="color" title="Select a noise color">
                <option value="random">Random Color</option>
                <optgroup label="Colors">
                <div class="color-options">
                    <option value="red" class="color-option">Red</option>
                    <option value="green" class="color-option">Green</option>
                    <option value="blue" class="color-option">Blue</option>
                    <option value="purple" class="color-option">Purple</option>
                    <option value="yellow" class="color-option">Yellow</option>
                    <option value="cyan" class="color-option">Cyan</option>
                    <option value="white" class="color-option">White</option>
                    <option value="black" class="color-option">Black</option>
                    <option value="pink" class="color-option">Pink</option>
                    <option value="orange" class="color-option">Orange</option>
                    <option value="brown" class="color-option">Brown</option>
                    <option value="gray" class="color-option">Gray</option>
                    <option value="light_blue" class="color-option">Light Blue</option>
                    <option value="lime" class="color-option">Lime</option>
                    <option value="magenta" class="color-option">Magenta</option>
                    <option value="olive" class="color-option">Olive</option>
                    <option value="teal" class="color-option">Teal</option>
                    <option value="navy" class="color-option">Navy</option>
                    <option value="maroon" class="color-option">Maroon</option>
                    <option value="silver" class="color-option">Silver</option>
                    <option value="gold" class="color-option">Gold</option>
                    <option value="sky_blue" class="color-option">Sky Blue</option>
                    <option value="violet" class="color-option">Violet</option>
                    <option value="indigo" class="color-option">Indigo</option>
                    <option value="turquoise" class="color-option">Turquoise</option>
                    <option value="tan" class="color-option">Tan</option>
                    <option value="beige" class="color-option">Beige</option>
                    <option value="salmon" class="color-option">Salmon</option>
                    <option value="peach" class="color-option">Peach</option>
                    <option value="lavender" class="color-option">Lavender</option>
                    <option value="coral" class="color-option">Coral</option>
                    <option value="khaki" class="color-option">Khaki</option>
                    <option value="mauve" class="color-option">Mauve</option>
                    <option value="crimson" class="color-option">Crimson</option>
                    <option value="mint" class="color-option">Mint</option>
                    <option value="apricot" class="color-option">Apricot</option>
                    <option value="navajo_white" class="color-option">Navajo White</option>
                    <option value="old_lace" class="color-option">Old Lace</option>
                    <option value="pale_goldenrod" class="color-option">Pale Goldenrod</option>
                    <option value="pale_green" class="color-option">Pale Green</option>
                    <option value="pale_turquoise" class="color-option">Pale Turquoise</option>
                    <option value="papaya_whip" class="color-option">Papaya Whip</option>
                    <option value="peach_puff" class="color-option">Peach Puff</option>
                    <option value="peru" class="color-option">Peru</option>
                    <option value="plum" class="color-option">Plum</option>
                    <option value="powder_blue" class="color-option">Powder Blue</option>
                    <option value="rosy_brown" class="color-option">Rosy Brown</option>
                    <option value="saddle_brown" class="color-option">Saddle Brown</option>
                    <option value="sandy_brown" class="color-option">Sandy Brown</option>
                    <option value="sea_green" class="color-option">Sea Green</option>
                    <option value="seashell" class="color-option">Seashell</option>
                    <option value="sienna" class="color-option">Sienna</option>
                    <option value="sky_blue" class="color-option">Sky Blue</option>
                    <option value="slate_blue" class="color-option">Slate Blue</option>
                    <option value="slate_gray" class="color-option">Slate Gray</option>
                    <option value="snow" class="color-option">Snow</option>
                    <option value="spring_green" class="color-option">Spring Green</option>
                    <option value="steel_blue" class="color-option">Steel Blue</option>
                    <option value="tan" class="color-option">Tan</option>
                </div>
                </optgroup>
            </select>
            <br>
            <label>Select Denoising Mode:</label>
            <select id="modeSelect" name="mode" title="Select a denoising mode">
                <option value="minecraft">Minecraft Denoising</option>
                <option value="comic">Comic Denoising</option>
            </select>
            <br>
            <button type="submit" id="uploadButton">Upload & Process</button>
        </form>
        <div class="image-container">
            <div class="image-box"><h3>Original</h3><img id="original-img" src="" alt="Original Image"></div>
            <div class="image-box"><h3>Noisy</h3><img id="noisy-img" src="" alt="Noisy Image"></div>
            <div class="image-box">
                <h3>Denoised</h3>
                <img id="denoised-img" src="" alt="Denoised Image">
                <br>
                <a id="downloadLink" href="#" download="denoised_image.png" class="hidden">Download Denoised Image</a>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $("#upload-form").submit(function(event) {
                event.preventDefault();
                
                var formData = new FormData(this);
                formData.append("mode", $("#modeSelect").val()); // Add the selected mode to the form data
    
                $.ajax({
                    url: "/upload",
                    type: "POST",
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        // Generate a unique timestamp to prevent caching
                        const timestamp = new Date().getTime();
    
                        // Update the image sources with the timestamp
                        $("#original-img").attr("src", response.original + "?t=" + timestamp);
                        $("#noisy-img").attr("src", response.noisy + "?t=" + timestamp);
                        $("#denoised-img").attr("src", response.denoised + "?t=" + timestamp);
    
                        // Update the download link for the denoised image
                        $("#downloadLink").attr("href", response.denoised + "?t=" + timestamp);
                        $("#downloadLink").removeClass("hidden");
    
                        // Reset the form after successful upload
                        $("#upload-form")[0].reset();
                    }
                });
            });
    
            // Clear displayed images and download link when a new file is selected
            $("#imageUpload").change(function() {
                $("#original-img").attr("src", "").attr("alt", "Original Image");
                $("#noisy-img").attr("src", "").attr("alt", "Noisy Image");
                $("#denoised-img").attr("src", "").attr("alt", "Denoised Image");
                $("#downloadLink").addClass("hidden");
            });
        });
    </script>
</html>
